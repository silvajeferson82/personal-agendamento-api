services:
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8025:8025"

  api:
    environment:
      NODE_ENV: development
      DATABASE_PORT: 5432
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      MAIL_FROM: dev@personal-agendamento.test
    depends_on:
      mailhog:
        condition: service_started
